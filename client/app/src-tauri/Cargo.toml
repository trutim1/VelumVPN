[package]
name = "velum-app"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
default-run = "velum-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
vpn-anon-core = { path = "../.." }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"] }
