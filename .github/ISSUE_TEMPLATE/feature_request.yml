name: Предложение
description: Изменение поведения или интерфейса клиента
body:
  - type: textarea
    id: problem
    attributes:
      label: Какая задача не решается
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое изменение и альтернативы
    validations:
      required: true
  - type: input
    id: platforms
    attributes:
      label: Затронутые ОС
  - type: markdown
    attributes:
      value: "Не отправляйте секреты или реальные VPN-профили. Наличие протокола в каталоге не означает работающий туннель."
