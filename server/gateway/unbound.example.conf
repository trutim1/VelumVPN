server:
  verbosity: 1
  interface: 0.0.0.0
  port: 53
  access-control: 0.0.0.0/0 refuse
  access-control: 127.0.0.0/8 allow
  access-control: 10.77.0.0/24 allow
  access-control: 172.30.77.0/28 allow
  username: ""
  chroot: ""
  directory: "/etc/unbound"
  pidfile: ""
  trust-anchor-file: "/usr/share/dns/root.key"
  local-zone: "health.velum.invalid." static
  local-data: "health.velum.invalid. 60 IN A 127.0.0.1"
  do-daemonize: no
  do-ip4: yes
  do-ip6: no
  prefer-ip6: no
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes
  qname-minimisation-strict: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-below-nxdomain: yes
  unwanted-reply-threshold: 100000
  prefetch: yes
  rrset-roundrobin: yes
  edns-buffer-size: 1232
  max-udp-size: 1232
